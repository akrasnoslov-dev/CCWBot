services:
  bot:
    build: .
    container_name: ccwbot
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - postgres
    command: sh -c "alembic upgrade head && python main.py"

  postgres:
    image: postgres:16
    container_name: ccwbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ccwbot
      POSTGRES_USER: ccwbot
      POSTGRES_PASSWORD: ccwbot_password
    ports:
      - "5432:5432"
    volumes:
      - ccwbot_postgres_data:/var/lib/postgresql/data

volumes:
  ccwbot_postgres_data:
