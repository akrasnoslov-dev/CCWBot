services:
  bot:
    build: .
    container_name: ccwbot
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - postgres
    command: sh -c "alembic upgrade head && python main.py"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:16
    container_name: ccwbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ccwbot
      POSTGRES_USER: ccwbot
      POSTGRES_PASSWORD: ccwbot_password
    ports:
      - "5432:5432"
    volumes:
      - ccwbot_postgres_data:/var/lib/postgresql/data

volumes:
  ccwbot_postgres_data:
