services:
  bot:
    build: .
    container_name: ccwbot
    restart: always
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://ccwbot:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/ccwbot
    command: sh -c "alembic upgrade head && exec python main.py"
    ports:
      - "127.0.0.1:${HEALTH_PORT:-8080}:${HEALTH_PORT:-8080}"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import json, os, urllib.request; url='http://localhost:%s/health' % os.getenv('HEALTH_PORT', '8080'); data=json.loads(urllib.request.urlopen(url, timeout=5).read()); raise SystemExit(0 if data.get('status') == 'ok' else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:16
    ports:
      - "127.0.0.1:5433:5432"
    container_name: ccwbot-postgres
    restart: always
    environment:
      POSTGRES_DB: ccwbot
      POSTGRES_USER: ccwbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccwbot -d ccwbot"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ccwbot_postgres_data:/var/lib/postgresql/data

volumes:
  ccwbot_postgres_data:
