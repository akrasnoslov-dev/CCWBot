[tool.ruff]
line-length = 100
# Versioned historical experiment artifacts are evidence, not maintained runtime code.
# Keep them byte-for-byte intact; lint source, scripts, tests and future app code.
extend-exclude = ["reports/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
norecursedirs = [".git", ".venv", "pytest-cache-files-*"]
